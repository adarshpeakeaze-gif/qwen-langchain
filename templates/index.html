<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Assistant</title>
    <!-- PDF.js for rendering PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            font-size: 1rem;
        }

        .upload-area {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed #444;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }

        .upload-area.dragover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.1rem;
            color: #888;
        }

        .upload-text span {
            color: #00d4ff;
            text-decoration: underline;
        }

        #file-input {
            display: none;
        }

        .main-content {
            display: none;
        }

        .main-content.show {
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 20px;
        }

        @media (max-width: 1000px) {
            .main-content.show {
                grid-template-columns: 1fr;
            }
        }

        .preview-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .preview-panel h3 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .document-viewer {
            background: #0d0d0d;
            border-radius: 10px;
            min-height: 500px;
            max-height: 600px;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .document-viewer img {
            max-width: 100%;
            max-height: 580px;
            object-fit: contain;
        }

        .document-viewer canvas {
            max-width: 100%;
            display: block;
        }

        .zoom-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        .zoom-controls button {
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .zoom-controls button:hover {
            background: rgba(0, 212, 255, 0.3);
        }

        .zoom-controls span {
            color: #888;
            font-size: 0.85rem;
            min-width: 50px;
            text-align: center;
        }

        .pdf-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        .pdf-controls button {
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .pdf-controls button:hover {
            background: rgba(0, 212, 255, 0.3);
        }

        .pdf-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pdf-controls span {
            color: #888;
            font-size: 0.85rem;
        }

        .file-info {
            text-align: center;
            color: #888;
            margin-bottom: 15px;
            font-size: 0.85rem;
            word-break: break-all;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            border-color: #666;
            color: #fff;
        }

        .results-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .result-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
        }

        .collapsible-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid #333;
            transition: background 0.2s;
        }

        .collapsible-header:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .collapsible-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .collapsible-title .icon {
            font-size: 1.2rem;
        }

        .collapsible-toggle {
            color: #888;
            transition: transform 0.3s;
        }

        .collapsible-toggle.open {
            transform: rotate(180deg);
        }

        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .collapsible-content.open {
            max-height: 3000px;
        }

        .collapsible-body {
            padding: 20px;
        }

        .description-text {
            line-height: 1.8;
            font-size: 0.95rem;
            color: #ddd;
            white-space: pre-wrap;
        }

        .speak-btn {
            background: rgba(0, 255, 100, 0.2);
            border: 1px solid #00ff64;
            color: #00ff64;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .speak-btn:hover {
            background: rgba(0, 255, 100, 0.3);
        }

        .speak-btn.speaking {
            background: rgba(255, 100, 100, 0.2);
            border-color: #ff6464;
            color: #ff6464;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #888;
        }

        .error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .api-status {
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        .api-status.configured {
            background: rgba(0, 255, 100, 0.1);
            color: #00ff64;
        }

        .api-status.not-configured {
            background: rgba(255, 68, 68, 0.1);
            color: #ff6b6b;
        }

        .doc-type-badge {
            display: inline-block;
            background: linear-gradient(90deg, #7b2cbf, #00d4ff);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        /* JSON Syntax Highlighting */
        .json-viewer {
            background: #0a0a0f;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
            font-size: 0.8rem;
            border: 1px solid #333;
            max-height: 500px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .json-key {
            color: #7dd3fc;
        }

        .json-string {
            color: #86efac;
        }

        .json-number {
            color: #fcd34d;
        }

        .json-boolean {
            color: #f472b6;
        }

        .json-null {
            color: #94a3b8;
        }

        .json-bracket {
            color: #e2e8f0;
        }

        .timing-info {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .timing-badge {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
        }

        .request-id {
            color: #666;
            font-size: 0.75rem;
            font-family: monospace;
            margin-bottom: 10px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            color: #888;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            border-color: #666;
            color: #fff;
        }

        .tab-btn.active {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .extracted-fields {
            display: grid;
            gap: 10px;
        }

        .field-row {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            overflow: hidden;
        }

        .field-label {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            padding: 8px 12px;
            min-width: 180px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .field-value {
            padding: 8px 12px;
            color: #ddd;
            font-size: 0.85rem;
            flex: 1;
        }

        .field-value.null {
            color: #666;
            font-style: italic;
        }

        /* Key-Value Renderer Styles */
        .kv-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .kv-row {
            display: flex;
            border-bottom: 1px solid #2a2a3a;
        }

        .kv-row:last-child {
            border-bottom: none;
        }

        .kv-key {
            min-width: 220px;
            max-width: 220px;
            padding: 10px 15px;
            background: rgba(0, 212, 255, 0.08);
            color: #7dd3fc;
            font-size: 0.85rem;
            font-weight: 500;
            border-right: 1px solid #2a2a3a;
        }

        .kv-value {
            flex: 1;
            padding: 10px 15px;
            color: #e2e8f0;
            font-size: 0.85rem;
            word-break: break-word;
        }

        .kv-value.null {
            color: #666;
            font-style: italic;
        }

        .kv-value.number {
            font-family: 'Monaco', 'Menlo', monospace;
            color: #fcd34d;
        }

        .kv-value.boolean-true {
            color: #22c55e;
        }

        .kv-value.boolean-false {
            color: #ef4444;
        }

        /* Collapsible nested section */
        .kv-nested {
            margin: 5px 0;
        }

        .kv-nested-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(123, 44, 191, 0.15);
            border: 1px solid rgba(123, 44, 191, 0.3);
            border-radius: 6px;
            cursor: pointer;
            color: #c084fc;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .kv-nested-header:hover {
            background: rgba(123, 44, 191, 0.25);
        }

        .kv-nested-toggle {
            transition: transform 0.2s;
            font-size: 0.7rem;
        }

        .kv-nested-toggle.open {
            transform: rotate(90deg);
        }

        .kv-nested-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            margin-top: 5px;
            margin-left: 15px;
            border-left: 2px solid rgba(123, 44, 191, 0.3);
            padding-left: 10px;
        }

        .kv-nested-content.open {
            max-height: 5000px;
        }

        .kv-array-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .kv-array-index {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            border-bottom: 1px solid #2a2a3a;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Document Assistant</h1>
            <p class="subtitle">Upload a document to analyze and extract information</p>
        </header>

        <div id="api-status" class="api-status"></div>

        <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
            <div class="upload-icon">📄</div>
            <p class="upload-text">Drop your document here or <span>browse</span></p>
            <p style="color: #666; font-size: 0.9rem; margin-top: 10px;">Supports JPG, PNG, PDF</p>
        </div>

        <input type="file" id="file-input" accept="image/*,.pdf,application/pdf">

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">Analyzing your document...</p>
            <p class="loading-text" style="font-size: 0.9rem; margin-top: 10px;" id="loading-step">Step 1: Vision analysis</p>
        </div>

        <div class="error" id="error"></div>

        <div class="main-content" id="main-content">
            <!-- Left Panel: Document Viewer -->
            <div class="preview-panel">
                <h3>Document Preview</h3>
                <div class="document-viewer" id="document-viewer">
                    <img id="preview-image" src="" alt="Document preview" style="display: none;">
                    <canvas id="pdf-canvas" style="display: none;"></canvas>
                </div>
                <div class="zoom-controls" id="zoom-controls" style="display: none;">
                    <button onclick="zoomOut()">−</button>
                    <span id="zoom-level">100%</span>
                    <button onclick="zoomIn()">+</button>
                    <button onclick="resetZoom()" style="font-size: 0.75rem; padding: 6px 10px;">Reset</button>
                </div>
                <div class="pdf-controls" id="pdf-controls" style="display: none;">
                    <button onclick="prevPage()" id="prev-btn">← Prev</button>
                    <span id="page-info">Page 1 of 1</span>
                    <button onclick="nextPage()" id="next-btn">Next →</button>
                </div>
                <p class="file-info" id="file-info"></p>
                <button class="btn btn-primary" id="analyze-btn" onclick="analyzeDocument()">
                    Analyze Document
                </button>
                <button class="btn btn-secondary" onclick="resetUpload()">
                    Choose Different File
                </button>
            </div>

            <!-- Right Panel: Results -->
            <div class="results-panel" id="results-panel">
                <!-- Description Section -->
                <div class="result-container" id="description-section" style="display: none;">
                    <div class="collapsible-header" onclick="toggleSection('description')">
                        <div class="collapsible-title">
                            <span class="icon">📝</span>
                            <span>Document Description</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <button class="speak-btn" id="speak-btn" onclick="event.stopPropagation(); toggleSpeech();">
                                🔊 Read
                            </button>
                            <span class="collapsible-toggle open" id="description-toggle">▼</span>
                        </div>
                    </div>
                    <div class="collapsible-content open" id="description-content">
                        <div class="collapsible-body">
                            <div class="description-text" id="description-text"></div>
                        </div>
                    </div>
                </div>

                <!-- Classification Section -->
                <div class="result-container" id="classification-section" style="display: none;">
                    <div class="collapsible-header" onclick="toggleSection('classification')">
                        <div class="collapsible-title">
                            <span class="icon">🏷️</span>
                            <span>Extracted Data</span>
                            <span class="doc-type-badge" id="doc-type-badge"></span>
                        </div>
                        <span class="collapsible-toggle open" id="classification-toggle">▼</span>
                    </div>
                    <div class="collapsible-content open" id="classification-content">
                        <div class="collapsible-body">
                            <div class="tab-buttons">
                                <button class="tab-btn active" onclick="switchTab('classification', 'formatted')">Formatted</button>
                                <button class="tab-btn" onclick="switchTab('classification', 'json')">JSON</button>
                            </div>
                            <div class="tab-content active" id="classification-formatted-tab">
                                <div id="formatted-view"></div>
                            </div>
                            <div class="tab-content" id="classification-json-tab">
                                <div class="json-viewer" id="classification-json"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Full Response JSON Section -->
                <div class="result-container" id="json-section" style="display: none;">
                    <div class="collapsible-header" onclick="toggleSection('json')">
                        <div class="collapsible-title">
                            <span class="icon">{ }</span>
                            <span>Full API Response</span>
                        </div>
                        <span class="collapsible-toggle" id="json-toggle">▼</span>
                    </div>
                    <div class="collapsible-content" id="json-content">
                        <div class="collapsible-body">
                            <div class="timing-info" id="timing-info"></div>
                            <p class="request-id" id="request-id"></p>
                            <div class="json-viewer" id="full-json"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize PDF.js
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        let currentFile = null;
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let speechUtterance = null;
        let isSpeaking = false;
        let currentZoom = 1.0;
        let baseScale = 1.0;
        const MIN_ZOOM = 0.5;
        const MAX_ZOOM = 3.0;
        const ZOOM_STEP = 0.25;

        // Check API status on load
        fetch('/api/status')
            .then(r => r.json())
            .then(data => {
                const statusEl = document.getElementById('api-status');
                if (data.configured) {
                    statusEl.className = 'api-status configured';
                    const keyCount = data.key_status?.openrouter?.total_keys || 0;
                    statusEl.textContent = `✓ Ready | ${keyCount} key(s) | Vision: ${data.vision_model} | Classifier: ${data.classifier_model}`;
                } else {
                    statusEl.className = 'api-status not-configured';
                    statusEl.textContent = '⚠ OPENROUTER_API_KEYS not configured';
                }
            })
            .catch(err => {
                const statusEl = document.getElementById('api-status');
                statusEl.className = 'api-status not-configured';
                statusEl.textContent = '⚠ Could not connect to API';
            });

        // File input change
        document.getElementById('file-input').addEventListener('change', function(e) {
            handleFile(e.target.files[0]);
        });

        // Drag and drop
        const uploadArea = document.getElementById('upload-area');

        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && (file.type.startsWith('image/') || file.type === 'application/pdf')) {
                handleFile(file);
            }
        });

        function handleFile(file) {
            if (!file) return;

            currentFile = file;
            const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');

            document.getElementById('upload-area').style.display = 'none';
            document.getElementById('main-content').classList.add('show');
            document.getElementById('file-info').textContent = file.name + ' (' + formatFileSize(file.size) + ')';

            // Hide results sections
            document.getElementById('description-section').style.display = 'none';
            document.getElementById('classification-section').style.display = 'none';
            document.getElementById('json-section').style.display = 'none';
            document.getElementById('error').classList.remove('show');

            if (isPDF) {
                renderPDF(file);
            } else {
                renderImage(file);
            }
        }

        function renderImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('preview-image');
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('pdf-canvas').style.display = 'none';
                document.getElementById('pdf-controls').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        async function renderPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            totalPages = pdfDoc.numPages;
            currentPage = 1;
            currentZoom = 1.0;

            document.getElementById('preview-image').style.display = 'none';
            document.getElementById('pdf-canvas').style.display = 'block';
            document.getElementById('pdf-controls').style.display = 'flex';
            document.getElementById('zoom-controls').style.display = 'flex';
            document.getElementById('zoom-level').textContent = '100%';

            renderPage(currentPage);
        }

        async function renderPage(pageNum) {
            const page = await pdfDoc.getPage(pageNum);
            const canvas = document.getElementById('pdf-canvas');
            const ctx = canvas.getContext('2d');

            // Get device pixel ratio for high-DPI displays
            const pixelRatio = window.devicePixelRatio || 1;

            // Scale to fit container width initially
            const containerWidth = document.getElementById('document-viewer').clientWidth - 20;
            const viewport = page.getViewport({ scale: 1 });
            baseScale = containerWidth / viewport.width;

            // Apply zoom level
            const finalScale = baseScale * currentZoom;
            const scaledViewport = page.getViewport({ scale: finalScale });

            // Set canvas size accounting for pixel ratio (for crisp rendering)
            canvas.width = scaledViewport.width * pixelRatio;
            canvas.height = scaledViewport.height * pixelRatio;

            // Set display size (CSS)
            canvas.style.width = scaledViewport.width + 'px';
            canvas.style.height = scaledViewport.height + 'px';

            // Scale context for high-DPI
            ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

            // Clear and render with high quality
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            await page.render({
                canvasContext: ctx,
                viewport: scaledViewport
            }).promise;

            document.getElementById('page-info').textContent = `Page ${pageNum} of ${totalPages}`;
            document.getElementById('prev-btn').disabled = pageNum <= 1;
            document.getElementById('next-btn').disabled = pageNum >= totalPages;
        }

        function zoomIn() {
            if (currentZoom < MAX_ZOOM) {
                currentZoom = Math.min(currentZoom + ZOOM_STEP, MAX_ZOOM);
                updateZoomLevel();
                renderPage(currentPage);
            }
        }

        function zoomOut() {
            if (currentZoom > MIN_ZOOM) {
                currentZoom = Math.max(currentZoom - ZOOM_STEP, MIN_ZOOM);
                updateZoomLevel();
                renderPage(currentPage);
            }
        }

        function resetZoom() {
            currentZoom = 1.0;
            updateZoomLevel();
            renderPage(currentPage);
        }

        function updateZoomLevel() {
            document.getElementById('zoom-level').textContent = Math.round(currentZoom * 100) + '%';
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function resetUpload() {
            currentFile = null;
            pdfDoc = null;
            currentZoom = 1.0;
            document.getElementById('file-input').value = '';
            document.getElementById('upload-area').style.display = 'block';
            document.getElementById('main-content').classList.remove('show');
            document.getElementById('description-section').style.display = 'none';
            document.getElementById('classification-section').style.display = 'none';
            document.getElementById('json-section').style.display = 'none';
            document.getElementById('zoom-controls').style.display = 'none';
            document.getElementById('error').classList.remove('show');
            stopSpeech();
        }

        function analyzeDocument() {
            if (!currentFile) return;

            const btn = document.getElementById('analyze-btn');
            btn.disabled = true;

            document.getElementById('loading').classList.add('show');
            document.getElementById('description-section').style.display = 'none';
            document.getElementById('classification-section').style.display = 'none';
            document.getElementById('json-section').style.display = 'none';
            document.getElementById('error').classList.remove('show');

            document.getElementById('loading-step').textContent = 'Step 1: Vision analysis...';

            const formData = new FormData();
            formData.append('file', currentFile);

            fetch('/api/describe', {
                method: 'POST',
                body: formData
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').classList.remove('show');
                btn.disabled = false;

                if (data.success) {
                    document.getElementById('description-text').textContent = data.description;
                    document.getElementById('description-section').style.display = 'block';

                    if (data.classification) {
                        displayClassification(data.classification);
                    }

                    displayFullJson(data);
                } else {
                    showError(data.error || 'Failed to analyze document');
                }
            })
            .catch(err => {
                document.getElementById('loading').classList.remove('show');
                btn.disabled = false;
                showError('Network error: ' + err.message);
            });
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function toggleSection(section) {
            const content = document.getElementById(section + '-content');
            const toggle = document.getElementById(section + '-toggle');

            if (content.classList.contains('open')) {
                content.classList.remove('open');
                toggle.classList.remove('open');
            } else {
                content.classList.add('open');
                toggle.classList.add('open');
            }
        }

        function switchTab(section, tab) {
            const container = document.getElementById(section + '-content');
            container.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            container.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(section + '-' + tab + '-tab').classList.add('active');
        }

        function toggleSpeech() {
            if (isSpeaking) {
                stopSpeech();
            } else {
                startSpeech();
            }
        }

        function startSpeech() {
            const text = document.getElementById('description-text').textContent;
            if (!text || !('speechSynthesis' in window)) return;

            speechUtterance = new SpeechSynthesisUtterance(text);
            speechUtterance.rate = 0.9;
            speechUtterance.pitch = 1;

            speechUtterance.onend = function() {
                isSpeaking = false;
                updateSpeakButton();
            };

            window.speechSynthesis.speak(speechUtterance);
            isSpeaking = true;
            updateSpeakButton();
        }

        function stopSpeech() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            isSpeaking = false;
            updateSpeakButton();
        }

        function updateSpeakButton() {
            const btn = document.getElementById('speak-btn');
            if (isSpeaking) {
                btn.textContent = '⏹ Stop';
                btn.classList.add('speaking');
            } else {
                btn.textContent = '🔊 Read';
                btn.classList.remove('speaking');
            }
        }

        // JSON Syntax Highlighting
        function syntaxHighlight(json) {
            if (typeof json !== 'string') {
                json = JSON.stringify(json, null, 2);
            }

            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function displayClassification(classification) {
            const section = document.getElementById('classification-section');
            const badge = document.getElementById('doc-type-badge');
            const formattedView = document.getElementById('formatted-view');
            const jsonView = document.getElementById('classification-json');

            section.style.display = 'block';

            const docType = classification.document_type || 'unknown';
            badge.textContent = docType.replace(/_/g, ' ');

            // Parse classifier_summary if it's a JSON string
            let extractedData = null;
            if (classification.classifier_summary) {
                try {
                    extractedData = JSON.parse(classification.classifier_summary);
                } catch (e) {
                    // Not JSON, use as-is
                    extractedData = classification;
                }
            } else {
                extractedData = classification;
            }

            // Render formatted view as key-value pairs
            formattedView.innerHTML = renderFormattedDocument(extractedData);

            // Also show raw JSON in JSON tab
            jsonView.innerHTML = syntaxHighlight(extractedData);
        }

        let nestedIdCounter = 0;

        function formatKeyName(key) {
            return key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        function toggleNestedSection(id) {
            const content = document.getElementById('nested-content-' + id);
            const toggle = document.getElementById('nested-toggle-' + id);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                toggle.classList.remove('open');
            } else {
                content.classList.add('open');
                toggle.classList.add('open');
            }
        }

        function renderValue(value) {
            if (value === null || value === undefined) {
                return '<span class="kv-value null">null</span>';
            }
            if (typeof value === 'boolean') {
                return `<span class="kv-value ${value ? 'boolean-true' : 'boolean-false'}">${value}</span>`;
            }
            if (typeof value === 'number') {
                return `<span class="kv-value number">${value}</span>`;
            }
            return `<span class="kv-value">${String(value)}</span>`;
        }

        function renderKeyValuePairs(data, level = 0) {
            if (!data || typeof data !== 'object') {
                return renderValue(data);
            }

            const entries = Object.entries(data);
            let html = '<div class="kv-container">';

            for (const [key, value] of entries) {
                const keyLabel = formatKeyName(key);

                if (Array.isArray(value)) {
                    // Render array as collapsible
                    const id = nestedIdCounter++;
                    html += `
                        <div class="kv-row">
                            <div class="kv-key">${keyLabel}</div>
                            <div class="kv-value">
                                <div class="kv-nested">
                                    <div class="kv-nested-header" onclick="toggleNestedSection(${id})">
                                        <span class="kv-nested-toggle" id="nested-toggle-${id}">▶</span>
                                        <span>${value.length} item${value.length !== 1 ? 's' : ''}</span>
                                    </div>
                                    <div class="kv-nested-content" id="nested-content-${id}">
                                        ${value.map((item, idx) => `
                                            <div class="kv-array-item">
                                                <div class="kv-array-index">#${idx + 1}</div>
                                                ${typeof item === 'object' ? renderKeyValuePairs(item, level + 1) : renderValue(item)}
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (value !== null && typeof value === 'object') {
                    // Render nested object as collapsible
                    const id = nestedIdCounter++;
                    const keyCount = Object.keys(value).length;
                    html += `
                        <div class="kv-row">
                            <div class="kv-key">${keyLabel}</div>
                            <div class="kv-value">
                                <div class="kv-nested">
                                    <div class="kv-nested-header" onclick="toggleNestedSection(${id})">
                                        <span class="kv-nested-toggle" id="nested-toggle-${id}">▶</span>
                                        <span>${keyCount} field${keyCount !== 1 ? 's' : ''}</span>
                                    </div>
                                    <div class="kv-nested-content" id="nested-content-${id}">
                                        ${renderKeyValuePairs(value, level + 1)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // Render simple value
                    html += `
                        <div class="kv-row">
                            <div class="kv-key">${keyLabel}</div>
                            ${renderValue(value)}
                        </div>
                    `;
                }
            }

            html += '</div>';
            return html;
        }

        function renderFormattedDocument(data) {
            nestedIdCounter = 0; // Reset counter for each render
            return renderKeyValuePairs(data);
        }

        function displayFullJson(data) {
            const section = document.getElementById('json-section');
            const timingInfo = document.getElementById('timing-info');
            const requestId = document.getElementById('request-id');
            const jsonView = document.getElementById('full-json');

            section.style.display = 'block';

            timingInfo.innerHTML = '';
            if (data.timing) {
                if (data.timing.vision_seconds) {
                    timingInfo.innerHTML += `<span class="timing-badge">Vision: ${data.timing.vision_seconds.toFixed(2)}s</span>`;
                }
                if (data.timing.classification_seconds) {
                    timingInfo.innerHTML += `<span class="timing-badge">Classification: ${data.timing.classification_seconds.toFixed(2)}s</span>`;
                }
                if (data.timing.extraction_seconds) {
                    timingInfo.innerHTML += `<span class="timing-badge">Extraction: ${data.timing.extraction_seconds.toFixed(2)}s</span>`;
                }
            }
            if (data.processing_time_seconds) {
                timingInfo.innerHTML += `<span class="timing-badge">Total: ${data.processing_time_seconds.toFixed(2)}s</span>`;
            }

            requestId.textContent = `Request ID: ${data.request_id || 'N/A'}`;

            jsonView.innerHTML = syntaxHighlight(data);
        }
    </script>
</body>
</html>
